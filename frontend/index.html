<script>
    const BACKEND_API_URL = "";

    const DEFAULT_ACCOUNTS = [
      { name: "Drushya S N", account: "7739104826" },
      { name: "Ramesh Kumar", account: "4092817365" },
      { name: "Lakshmi Devi", account: "8821049512" }
    ];
    let accountsDB = JSON.parse(localStorage.getItem("kiosk_accounts_db")) || [...DEFAULT_ACCOUNTS];

    let state = "IDLE";
    let kioskMode = "prototype";
    let hardwareReady = false;
    let isThumbHeld = false;
    let isSimHold = false;
    let biometricHeartbeatTimer = null;
    let biometricPulseCount = 0;

    let txData = { matchedUser: null, txType: null, amount: null };
    let currentPromptText = "";

    // ==========================================
    // CROWD-RESILIENT HALF-DUPLEX VOICE ENGINE
    // ==========================================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let micHardwareOn = false;
    let awaitingUserTurn = false;
    let isSpeakingNow = false;
    let speechPollInterval = null;
    let currentSpeechId = 0;
    let hardwareMicStream = null;
    window.currentUtterance = null;

    // Engages browser WebRTC Hardware Echo Cancellation & Noise Suppression on the laptop mic
    async function lockHardwareNoiseCancellation() {
      if (hardwareMicStream || !navigator.mediaDevices) return;
      try {
        hardwareMicStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: false
          }
        });
      } catch (e) {}
    }

    // Filters out self-echo fragments from kiosk prompts
    function isSelfEcho(transcript) {
      const lower = transcript.toLowerCase();
      const kioskPhrases = [
        "please say your", "thumb contact locked", "account ending in",
        "say yes to verify", "would you like to make", "how many rupees",
        "scanning your thumbprint", "welcome to vaanibank"
      ];
      return kioskPhrases.some(phrase => lower.includes(phrase));
    }

    // Phonetic / Dice-Coefficient Fuzzy Matcher (handles Indian names & crowd noise)
    function findBestAccountMatch(spokenQuery) {
      const cleanQuery = spokenQuery.toLowerCase().replace(/[^a-z\s]/g, "").trim();
      if (!cleanQuery) return null;

      let bestMatch = null;
      let bestScore = 0;

      for (const acc of accountsDB) {
        const target = acc.name.toLowerCase().replace(/[^a-z\s]/g, "").trim();
        if (target === cleanQuery || target.includes(cleanQuery) || cleanQuery.includes(target)) {
          return acc;
        }
        // Compare first name and full name using character bigrams
        const targetFirst = target.split(" ")[0];
        const queryFirst = cleanQuery.split(" ")[0];
        const fullScore = bigramSimilarity(cleanQuery, target);
        const firstScore = bigramSimilarity(queryFirst, targetFirst);
        const score = Math.max(fullScore, firstScore);

        if (score > bestScore) {
          bestScore = score;
          bestMatch = acc;
        }
      }
      return bestScore >= 0.55 ? bestMatch : null;
    }

    function bigramSimilarity(str1, str2) {
      if (str1.length < 2 || str2.length < 2) return str1 === str2 ? 1 : 0;
      const bigrams1 = new Map();
      for (let i = 0; i < str1.length - 1; i++) {
        const bg = str1.substring(i, i + 2);
        bigrams1.set(bg, (bigrams1.get(bg) || 0) + 1);
      }
      let intersection = 0;
      for (let i = 0; i < str2.length - 1; i++) {
        const bg = str2.substring(i, i + 2);
        const count = bigrams1.get(bg) || 0;
        if (count > 0) {
          bigrams1.set(bg, count - 1);
          intersection++;
        }
      }
      return (2.0 * intersection) / (str1.length + str2.length - 2);
    }

    function createFreshRecognizer() {
      if (!SpeechRecognition) return null;
      const rec = new SpeechRecognition();
      rec.continuous = false;
      rec.interimResults = false;
      rec.maxAlternatives = 3; // Evaluates top 3 phonetic guesses from Chrome
      rec.lang = "en-IN";

      rec.onstart = () => {
        if (isSpeakingNow || window.speechSynthesis.speaking) {
          hardStopMic();
          return;
        }
        micHardwareOn = true;
        updateMicUI("LISTENING");
      };

      rec.onresult = (event) => {
        const alternatives = Array.from(event.results[0]).map(r => r.transcript.trim());
        const primarySpoken = alternatives[0] || "";
        hardStopMic();

        if (!primarySpoken || isSelfEcho(primarySpoken)) {
          if (isThumbHeld && state !== "IDLE" && state !== "DONE") {
            awaitingUserTurn = true;
            setTimeout(() => hardStartMic(), 300);
          }
          return;
        }

        document.getElementById("heard-transcript").textContent = `Heard: "${primarySpoken}"`;
        updateMicUI("PROCESSING");

        setTimeout(() => {
          processStepInput(primarySpoken, alternatives);
        }, 300);
      };

      rec.onerror = (event) => {
        micHardwareOn = false;
        if (event.error === "not-allowed") {
          awaitingUserTurn = false;
          updateMicUI("OFF");
          showBanner("Microphone blocked. Allow Microphone in address bar site settings.", "bg-rose-600 text-white");
        } else if (event.error === "no-speech" && awaitingUserTurn && !isSpeakingNow && !window.speechSynthesis.speaking && isThumbHeld) {
          updateMicUI("OFF");
          setTimeout(() => hardStartMic(), 250);
        } else {
          updateMicUI("OFF");
        }
      };

      rec.onend = () => {
        micHardwareOn = false;
        if (awaitingUserTurn && !isSpeakingNow && !window.speechSynthesis.speaking && isThumbHeld) {
          setTimeout(() => hardStartMic(), 250);
        } else {
          updateMicUI((isSpeakingNow || window.speechSynthesis.speaking) ? "SPEAKING" : "OFF");
        }
      };

      return rec;
    }

    function hardStartMic() {
      if (!SpeechRecognition || isSpeakingNow || window.speechSynthesis.speaking || !awaitingUserTurn || !isThumbHeld) {
        return;
      }
      if (micHardwareOn) return;
      try {
        recognition = createFreshRecognizer();
        recognition.start();
      } catch (e) {}
    }

    function hardStopMic() {
      awaitingUserTurn = false;
      if (recognition) {
        try {
          recognition.onend = null;
          recognition.onerror = null;
          recognition.onresult = null;
          recognition.abort();
        } catch (e) {}
        recognition = null;
      }
      micHardwareOn = false;
      updateMicUI((isSpeakingNow || window.speechSynthesis.speaking) ? "SPEAKING" : "OFF");
    }

    function speakOnly(text) {
      const myId = ++currentSpeechId;
      currentPromptText = text;
      hardStopMic();
      clearInterval(speechPollInterval);
      window.speechSynthesis.cancel();

      document.getElementById("kiosk-prompt-text").textContent = text;
      isSpeakingNow = true;
      updateMicUI("SPEAKING");

      setTimeout(() => {
        if (myId !== currentSpeechId) return;

        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-IN";
        utter.rate = 0.96;
        window.currentUtterance = utter;

        let hasStarted = false;
        const finish = () => {
          if (myId !== currentSpeechId) return;
          clearInterval(speechPollInterval);
          isSpeakingNow = false;
          updateMicUI("OFF");
        };

        utter.onstart = () => {
          if (myId !== currentSpeechId) return;
          hasStarted = true;
          speechPollInterval = setInterval(() => {
            if (hasStarted && !window.speechSynthesis.speaking && !window.speechSynthesis.pending) {
              finish();
            }
          }, 250);
        };

        utter.onend = finish;
        utter.onerror = (e) => {
          if (e.error === "canceled" || e.error === "interrupted") return;
          finish();
        };

        window.speechSynthesis.speak(utter);
      }, 150);
    }

    function askAndListen(text) {
      const myId = ++currentSpeechId;
      currentPromptText = text;
      hardStopMic();
      clearInterval(speechPollInterval);
      window.speechSynthesis.cancel();

      document.getElementById("kiosk-prompt-text").textContent = text;
      isSpeakingNow = true;
      updateMicUI("SPEAKING");

      setTimeout(() => {
        if (myId !== currentSpeechId) return;

        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-IN";
        utter.rate = 0.96;
        window.currentUtterance = utter;

        let hasStarted = false;
        let finished = false;

        const onSpeechCompletelyDone = () => {
          if (finished || myId !== currentSpeechId) return;
          finished = true;
          clearInterval(speechPollInterval);
          isSpeakingNow = false;
          updateMicUI("OFF");

          setTimeout(() => {
            if (myId !== currentSpeechId) return;
            if (!window.speechSynthesis.speaking && isThumbHeld && state !== "IDLE" && state !== "DONE" && state !== "BIO_SCANNING") {
              awaitingUserTurn = true;
              hardStartMic();
            }
          }, 750);
        };

        utter.onstart = () => {
          if (myId !== currentSpeechId) return;
          hasStarted = true;
          speechPollInterval = setInterval(() => {
            if (hasStarted && !window.speechSynthesis.speaking && !window.speechSynthesis.pending) {
              onSpeechCompletelyDone();
            }
          }, 250);
        };

        utter.onend = onSpeechCompletelyDone;
        utter.onerror = (e) => {
          if (e.error === "canceled" || e.error === "interrupted") return;
          clearInterval(speechPollInterval);
          isSpeakingNow = false;
          updateMicUI("OFF");
        };

        window.speechSynthesis.speak(utter);
      }, 150);
    }

    function repeatCurrentQuestion() {
      if (!currentPromptText) return;
      if (isThumbHeld && state !== "IDLE" && state !== "DONE") {
        askAndListen(currentPromptText);
      } else {
        speakOnly(currentPromptText);
      }
    }

    function manualMicTrigger() {
      if (isThumbHeld && state !== "IDLE" && state !== "DONE") {
        currentSpeechId++;
        clearInterval(speechPollInterval);
        window.speechSynthesis.cancel();
        isSpeakingNow = false;
        awaitingUserTurn = true;
        hardStartMic();
      }
    }

    function updateMicUI(status) {
      const dot = document.getElementById("mic-dot");
      const label = document.getElementById("mic-status-text");
      if (status === "LISTENING") {
        dot.className = "w-3 h-3 rounded-full bg-emerald-400 listening-pulse";
        label.textContent = "Mic ON — Speak Your Answer Now";
        label.className = "text-xs font-bold text-emerald-400";
      } else if (status === "SPEAKING") {
        dot.className = "w-3 h-3 rounded-full bg-amber-400";
        label.textContent = "Mic OFF (Machine Speaking...)";
        label.className = "text-xs font-semibold text-amber-400";
      } else if (status === "PROCESSING") {
        dot.className = "w-3 h-3 rounded-full bg-sky-400";
        label.textContent = "Mic OFF (Checking Answer...)";
        label.className = "text-xs font-semibold text-sky-400";
      } else {
        dot.className = "w-3 h-3 rounded-full bg-slate-600";
        label.textContent = "Mic OFF";
        label.className = "text-xs font-medium text-slate-400";
      }
    }

    async function activateKiosk() {
      document.getElementById("activation-overlay").classList.add("hidden");
      renderAccountList();
      await lockHardwareNoiseCancellation();
      speakOnly("Welcome to VaaniBank Kiosk. Please place and hold your thumb on the scanner to begin.");
    }

    async function setKioskMode(mode) {
      kioskMode = mode;
      const btnProto = document.getElementById("btn-prototype-mode");
      const btnUser = document.getElementById("btn-user-mode");

      if (mode === "prototype") {
        btnProto.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-500 text-slate-950 transition";
        btnUser.className = "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition";
        hideBanner();
        speakOnly("Prototype Mode active. Place and hold your thumb on the pad.");
      } else {
        btnUser.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 transition";
        btnProto.className = "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-300 hover:text-white transition";
        await checkRDServiceHardware();
      }
    }

    async function checkRDServiceHardware() {
      showBanner("Checking UIDAI L1 Biometric Scanner on https://127.0.0.1:11100...", "bg-amber-600 text-white");
      try {
        const controller = new AbortController();
        setTimeout(() => controller.abort(), 2000);
        const res = await fetch("https://127.0.0.1:11100", { method: "RDSERVICE", signal: controller.signal });
        const xml = await res.text();
        if (xml.includes("READY")) {
          hardwareReady = true;
          showBanner("UIDAI L1 Biometric Scanner Connected & READY.", "bg-emerald-600 text-white");
          speakOnly("Biometric hardware connected. Place your thumb on the scanner.");
        } else {
          throw new Error("NOTREADY");
        }
      } catch (e) {
        hardwareReady = false;
        showBanner("Device Not Connected: UIDAI L1 Scanner not detected on port 11100. Switch to Prototype Mode to test.", "bg-rose-600 text-white");
        speakOnly("Device not connected. Please connect the biometric scanner or switch to Prototype Mode.");
      }
    }

    function startThumbHold(e) {
      if (e) e.preventDefault();
      if (kioskMode === "user" && !hardwareReady) {
        showBanner("Cannot start: L1 Biometric Hardware not connected.", "bg-rose-600 text-white");
        return;
      }
      if (isThumbHeld) return;

      isThumbHeld = true;
      biometricPulseCount = 0;
      updateBiometricUI(true);

      clearInterval(biometricHeartbeatTimer);
      biometricHeartbeatTimer = setInterval(async () => {
        if (!isThumbHeld) {
          clearInterval(biometricHeartbeatTimer);
          return;
        }
        biometricPulseCount++;
        document.getElementById("bio-heartbeat-status").textContent = `Verified Pulse #${biometricPulseCount} (Active)`;
        document.getElementById("bio-heartbeat-status").className = "font-mono text-emerald-400";

        if (kioskMode === "user") {
          try {
            const res = await fetch("https://127.0.0.1:11100", { method: "RDSERVICE" });
            const text = await res.text();
            if (!text.includes("READY")) abortSession("Hardware scanner disconnected mid-session.");
          } catch (err) {
            abortSession("Hardware scanner connection lost.");
          }
        }
      }, 1500);

      if (state === "IDLE") {
        setKioskState("ASK_NAME");
        askAndListen("Thumb contact locked. Please say your registered full name.");
      }
    }

    function releaseThumbHold() {
      if (isSimHold) return;
      if (!isThumbHeld) return;

      isThumbHeld = false;
      clearInterval(biometricHeartbeatTimer);
      updateBiometricUI(false);

      if (state !== "IDLE" && state !== "DONE") {
        abortSession("Thumb contact lost! Transaction aborted for security.");
      }
    }

    function toggleSimulatedHold(checked) {
      isSimHold = checked;
      if (checked) {
        startThumbHold();
      } else {
        isThumbHeld = false;
        clearInterval(biometricHeartbeatTimer);
        updateBiometricUI(false);
        if (state !== "IDLE" && state !== "DONE") {
          abortSession("Thumb contact lost! Transaction aborted for security.");
        }
      }
    }

    function updateBiometricUI(locked) {
      const pad = document.getElementById("thumb-pad");
      const badge = document.getElementById("biometric-badge");
      const label = document.getElementById("thumb-label");
      const beam = document.getElementById("scan-beam");

      if (locked) {
        pad.className = "no-select relative overflow-hidden w-44 h-44 rounded-full border-4 border-emerald-400 bg-emerald-500/20 flex flex-col items-center justify-center transition-all shadow-lg";
        badge.textContent = "CONTINUOUS LOCK";
        badge.className = "px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400";
        label.textContent = "Thumb Locked (Evaluating...)";
        beam.classList.remove("hidden");
        document.getElementById("bio-heartbeat-status").textContent = "Pulse #1 (Active)";
        document.getElementById("bio-heartbeat-status").className = "font-mono text-emerald-400";
      } else {
        pad.className = "no-select relative overflow-hidden w-44 h-44 rounded-full border-4 border-slate-700 bg-slate-800/80 hover:border-emerald-500/60 flex flex-col items-center justify-center transition-all cursor-pointer";
        badge.textContent = "DISCONNECTED";
        badge.className = "px-2.5 py-1 rounded-full text-xs font-bold bg-slate-800 text-slate-400";
        label.textContent = "Press & Hold Thumb";
        beam.classList.add("hidden");
        document.getElementById("bio-heartbeat-status").textContent = "Idle";
        document.getElementById("bio-heartbeat-status").className = "font-mono text-slate-500";
      }
    }

    function abortSession(reason) {
      currentSpeechId++;
      hardStopMic();
      clearInterval(speechPollInterval);
      window.speechSynthesis.cancel();
      clearInterval(biometricHeartbeatTimer);
      txData = { matchedUser: null, txType: null, amount: null };
      document.getElementById("sim-hold-toggle").checked = false;
      isSimHold = false;
      isThumbHeld = false;
      updateBiometricUI(false);
      document.getElementById("bio-auth-status").textContent = "Aborted";
      document.getElementById("bio-auth-status").className = "font-mono text-rose-400";
      showBanner(reason, "bg-rose-600 text-white");
      setKioskState("IDLE");
      speakOnly(`${reason} Place your thumb on the scanner to start over.`);
    }

    function isYes(text) {
      return /\b(yes|yeah|yep|confirm|correct|right|ok|okay|sure|proceed|true)\b/i.test(text);
    }
    function isNo(text) {
      return /\b(no|nope|wrong|retry|change|cancel|back|incorrect|not)\b/i.test(text);
    }

    function handleManualInput(val) {
      if (!val || !val.trim()) return;
      hardStopMic();
      processStepInput(val.trim(), [val.trim()]);
    }

    async function processStepInput(spokenText, alternatives = [spokenText]) {
      if (!isThumbHeld) return;
      const clean = spokenText.trim();
      const lower = clean.toLowerCase();

      if (state === "ASK_NAME") {
        let match = null;
        for (const alt of alternatives) {
          match = findBestAccountMatch(alt);
          if (match) break;
        }

        if (match) {
          txData.matchedUser = match;
          const last4 = match.account.slice(-4);
          document.getElementById("matched-account-display").textContent = `${match.name} — Acct: ••••••${last4}`;
          document.getElementById("confirm-name-box").classList.remove("hidden");
          setKioskState("VERIFY_NAME");
          askAndListen(`I heard ${match.name}, account ending in ${last4.split("").join(" ")}. Say Yes to verify, or No to try again.`);
        } else {
          askAndListen(`I heard ${clean}, which is not registered. Please state your registered full name again.`);
        }
        return;
      }

      if (state === "VERIFY_NAME") {
        if (alternatives.some(a => isYes(a))) {
          confirmMatchedName(true);
        } else if (alternatives.some(a => isNo(a))) {
          confirmMatchedName(false);
        } else {
          askAndListen(`Please say Yes to verify ${txData.matchedUser.name}, or say No to re-enter your name.`);
        }
        return;
      }

      if (state === "ASK_TX") {
        if (alternatives.some(a => a.toLowerCase().includes("deposit"))) {
          selectTransactionType("DEPOSIT");
        } else if (alternatives.some(a => a.toLowerCase().includes("withdraw"))) {
          selectTransactionType("WITHDRAWAL");
        } else {
          askAndListen("Please say either Deposit or Withdrawal.");
        }
        return;
      }

      if (state === "VERIFY_TX") {
        if (alternatives.some(a => isYes(a))) {
          confirmTransactionType(true);
        } else if (alternatives.some(a => isNo(a))) {
          confirmTransactionType(false);
        } else {
          askAndListen(`You chose ${txData.txType}. Say Yes to verify, or No to change.`);
        }
        return;
      }

      if (state === "ASK_AMOUNT") {
        let num = null;
        for (const alt of alternatives) {
          num = extractNumberFromSpeech(alt.toLowerCase());
          if (num && num > 0) break;
        }
        if (num && num > 0) {
          selectAmount(num);
        } else {
          askAndListen("I did not catch the amount. Please clearly state the amount in rupees.");
        }
        return;
      }

      if (state === "VERIFY_AMOUNT") {
        if (alternatives.some(a => isYes(a))) {
          runMidSessionBiometricScan();
        } else if (alternatives.some(a => isNo(a))) {
          retryAmount();
        } else {
          askAndListen(`Say Yes to authenticate your thumbprint and print the ${txData.txType} slip for ${txData.amount} rupees, or say No to change the amount.`);
        }
        return;
      }
    }

    function confirmMatchedName(ok) {
      document.getElementById("confirm-name-box").classList.add("hidden");
      if (ok) {
        setKioskState("ASK_TX");
        askAndListen("Name verified. Would you like to make a Deposit or a Withdrawal?");
      } else {
        txData.matchedUser = null;
        setKioskState("ASK_NAME");
        askAndListen("Okay. Please state your registered full name again.");
      }
    }

    function selectTransactionType(type) {
      hardStopMic();
      txData.txType = type;
      document.getElementById("tx-verify-display").textContent = `Selected: ${type} (Say "Yes" or "No")`;
      document.getElementById("confirm-tx-box").classList.remove("hidden");
      setKioskState("VERIFY_TX");
      askAndListen(`You selected ${type.toLowerCase()}. Is that correct? Say Yes or No.`);
    }

    function confirmTransactionType(ok) {
      document.getElementById("confirm-tx-box").classList.add("hidden");
      if (ok) {
        setKioskState("ASK_AMOUNT");
        askAndListen(`${txData.txType.toLowerCase()} verified. How many rupees would you like to ${txData.txType.toLowerCase()}?`);
      } else {
        txData.txType = null;
        setKioskState("ASK_TX");
        askAndListen("Okay. Please say Deposit or Withdrawal.");
      }
    }

    function selectAmount(val) {
      const amt = parseFloat(val);
      if (isNaN(amt) || amt <= 0) return;
      hardStopMic();
      txData.amount = amt;
      document.getElementById("final-summary-text").textContent = `${txData.txType} of ₹${amt.toLocaleString("en-IN")} — ${txData.matchedUser.name}`;
      document.getElementById("final-confirm-box").classList.remove("hidden");
      setKioskState("VERIFY_AMOUNT");
      askAndListen(`You entered ${amt} rupees for ${txData.txType.toLowerCase()}. Say Yes to run biometric authentication and print your slip, or No to change the amount.`);
    }

    function retryAmount() {
      document.getElementById("final-confirm-box").classList.add("hidden");
      txData.amount = null;
      setKioskState("ASK_AMOUNT");
      askAndListen("Okay. Please state the amount in rupees again.");
    }

    async function runMidSessionBiometricScan() {
      if (!isThumbHeld) {
        abortSession("Thumb removed during biometric authentication!");
        return;
      }

      hardStopMic();
      setKioskState("BIO_SCANNING");
      document.getElementById("bio-auth-status").textContent = "Scanning Ridge Minutiae...";
      document.getElementById("bio-auth-status").className = "font-mono text-amber-400";
      speakOnly("Scanning your thumbprint for biometric authentication. Keep holding still.");

      if (kioskMode === "user") {
        try {
          const pidOpts = `<PidOptions ver="1.0"><Opts fCount="1" fType="2" iCount="0" pCount="0" format="0" pidVer="2.0" timeout="10000" env="P"/></PidOptions>`;
          const res = await fetch("https://127.0.0.1:11100/rd/capture", { method: "CAPTURE", body: pidOpts });
          const xml = await res.text();
          if (!xml.includes('errCode="0"')) {
            abortSession("Biometric fingerprint match failed on L1 hardware.");
            return;
          }
        } catch (err) {
          abortSession("Hardware capture failed during biometric scan.");
          return;
        }
      }

      setTimeout(async () => {
        if (!isThumbHeld) {
          abortSession("Thumb lifted during biometric verification!");
          return;
        }

        document.getElementById("bio-auth-status").textContent = "AUTHENTICATED ✔";
        document.getElementById("bio-auth-status").className = "font-mono font-bold text-emerald-400";
        await generateFinalSlip();
      }, 2200);
    }

    async function generateFinalSlip() {
      setKioskState("DONE");
      document.getElementById("step-workspace").classList.add("hidden");

      const refId = "BIO-" + Math.random().toString(36).substring(2, 10).toUpperCase();
      const timestamp = new Date().toLocaleString("en-IN");
      const hash = await sha256Hex(`${txData.matchedUser.account}:${txData.txType}:${txData.amount}:${biometricPulseCount}:${Date.now()}`);

      document.getElementById("slip-tx-type").textContent = `${txData.txType} SLIP`;
      document.getElementById("slip-timestamp").textContent = timestamp;
      document.getElementById("slip-name").textContent = txData.matchedUser.name;
      document.getElementById("slip-account").textContent = txData.matchedUser.account;
      document.getElementById("slip-amount").textContent = `₹ ${txData.amount.toLocaleString("en-IN")}.00`;
      document.getElementById("slip-ref").textContent = refId;
      document.getElementById("slip-hash").textContent = `eSign Hash: ${hash}`;

      document.getElementById("printable-slip").classList.remove("hidden");
      speakOnly("Biometric authentication succeeded. Your cryptographic e-Sign slip is ready. You may now release your thumb.");
    }

    function resetAfterCompletion() {
      currentSpeechId++;
      hardStopMic();
      clearInterval(speechPollInterval);
      clearInterval(biometricHeartbeatTimer);
      txData = { matchedUser: null, txType: null, amount: null };
      document.getElementById("sim-hold-toggle").checked = false;
      isSimHold = false;
      isThumbHeld = false;
      updateBiometricUI(false);
      document.getElementById("bio-auth-status").textContent = "Pending";
      document.getElementById("bio-auth-status").className = "font-mono text-slate-500";
      document.getElementById("printable-slip").classList.add("hidden");
      document.getElementById("step-workspace").classList.remove("hidden");
      setKioskState("IDLE");
      speakOnly("Ready for next user. Please place and hold your thumb on the scanner.");
    }

    function setKioskState(newState) {
      state = newState;
      const stepLabels = {
        IDLE: "Step 1 / 4 — Waiting for Thumb",
        ASK_NAME: "Step 2 / 4 — Customer Name",
        VERIFY_NAME: "Step 2 / 4 — Verify Account",
        ASK_TX: "Step 3 / 4 — Transaction Type",
        VERIFY_TX: "Step 3 / 4 — Verify Type",
        ASK_AMOUNT: "Step 4 / 4 — Amount",
        VERIFY_AMOUNT: "Step 4 / 4 — Final Verification",
        BIO_SCANNING: "Biometric Scan in Progress...",
        DONE: "Completed — Slip Generated"
      };
      document.getElementById("step-counter").textContent = stepLabels[newState] || newState;

      document.getElementById("ui-step-1").classList.toggle("hidden", newState !== "IDLE");
      document.getElementById("ui-step-2").classList.toggle("hidden", newState !== "ASK_NAME" && newState !== "VERIFY_NAME");
      document.getElementById("ui-step-3").classList.toggle("hidden", newState !== "ASK_TX" && newState !== "VERIFY_TX");
      document.getElementById("ui-step-4").classList.toggle("hidden", newState !== "ASK_AMOUNT" && newState !== "VERIFY_AMOUNT" && newState !== "BIO_SCANNING");

      if (newState === "ASK_NAME") document.getElementById("confirm-name-box").classList.add("hidden");
      if (newState === "ASK_TX") document.getElementById("confirm-tx-box").classList.add("hidden");
      if (newState === "ASK_AMOUNT") document.getElementById("final-confirm-box").classList.add("hidden");
      hideBanner();
    }

    function toggleAccountModal(show) {
      document.getElementById("account-modal").classList.toggle("hidden", !show);
      if (show) renderAccountList();
    }

    function generateRandomAccountNum() {
      document.getElementById("new-acc-num").value = Math.floor(1000000000 + Math.random() * 9000000000).toString();
    }

    function addNewAccount() {
      const name = document.getElementById("new-acc-name").value.trim();
      const account = document.getElementById("new-acc-num").value.trim();
      if (!name || account.length < 6) {
        alert("Please enter a valid full name and account number.");
        return;
      }
      accountsDB.push({ name, account });
      localStorage.setItem("kiosk_accounts_db", JSON.stringify(accountsDB));
      document.getElementById("new-acc-name").value = "";
      document.getElementById("new-acc-num").value = "";
      renderAccountList();
    }

    function renderAccountList() {
      document.getElementById("account-count").textContent = accountsDB.length;
      document.getElementById("registered-accounts-list").innerHTML = accountsDB.map(a => `
        <li class="flex justify-between bg-slate-950 px-3 py-2 rounded border border-slate-800">
          <span class="font-medium text-slate-200">${a.name}</span>
          <span class="font-mono text-emerald-400">${a.account}</span>
        </li>
      `).join("");
    }

    function showBanner(msg, classes) {
      const el = document.getElementById("alert-banner");
      el.textContent = msg;
      el.className = `px-6 py-3 text-center font-semibold text-sm no-print ${classes}`;
    }

    function hideBanner() {
      document.getElementById("alert-banner").classList.add("hidden");
    }

    function extractNumberFromSpeech(text) {
      const cleaned = text.replace(/,/g, "");
      const digits = cleaned.match(/\d+/);
      if (digits) return parseFloat(digits[0]);
      const words = {
        "hundred": 100, "five hundred": 500, "thousand": 1000,
        "two thousand": 2000, "five thousand": 5000, "ten thousand": 10000
      };
      for (const [key, val] of Object.entries(words)) {
        if (cleaned.includes(key)) return val;
      }
      return null;
    }

    async function sha256Hex(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("").toUpperCase();
    }
  </script>
