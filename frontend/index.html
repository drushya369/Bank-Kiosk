<script>
    const BACKEND_API_URL = "https://bank-kiosk-api.onrender.com";
    const DEFAULT_ACCOUNTS = [
      { name: "Drushya S N", account: "7739104826" },
      { name: "Ramesh Kumar", account: "4092817365" },
      { name: "Lakshmi Devi", account: "8821049512" }
    ];
    let accountsDB = JSON.parse(localStorage.getItem("kiosk_accounts_db")) || [...DEFAULT_ACCOUNTS];

    let state = "IDLE";
    let kioskMode = "prototype";
    let hardwareReady = false;
    let isThumbHeld = false;
    let isSimHold = false;
    let biometricHeartbeatTimer = null;
    let biometricPulseCount = 0;
    let txData = { matchedUser: null, txType: null, amount: null };
    let currentPromptText = "";
    let lastSpokeAt = 0;

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let activeRec = null;
    let speakWatchdog = null;
    let restartTimer = null;
    let speechEndTimer = null;
    let micOpenTimer = null;
    let isSpeaking = false;
    let isListening = false;
    let shouldListen = false;
    let turnId = 0;

    function warmUpBackend() {
      fetch(`${BACKEND_API_URL}/`, { cache: "no-store" }).catch(() => {});
    }

    function updateMicUI(mode) {
      const dot = document.getElementById("mic-dot");
      const txt = document.getElementById("mic-status-text");
      if (!dot || !txt) return;
      if (mode === "LISTENING") {
        dot.className = "mic-live";
        dot.style.background = "#10b981";
        txt.textContent = "Mic ON — Speak now...";
        txt.style.color = "#34d399";
      } else if (mode === "SPEAKING") {
        dot.className = "";
        dot.style.background = "#f59e0b";
        txt.textContent = "Mic OFF (Kiosk speaking)";
        txt.style.color = "#fbbf24";
      } else {
        dot.className = "";
        dot.style.background = "#475569";
        txt.textContent = "Auto-Mic Standby";
        txt.style.color = "#94a3b8";
      }
    }

    function stopListening() {
      shouldListen = false;
      clearTimeout(restartTimer);
      clearTimeout(speechEndTimer);
      clearTimeout(micOpenTimer);
      if (activeRec) {
        try {
          activeRec.onresult = null;
          activeRec.onerror = null;
          activeRec.onnomatch = null;
          activeRec.onspeechend = null;
          activeRec.onend = null;
          activeRec.abort();
        } catch (e) {}
        activeRec = null;
      }
      isListening = false;
      updateMicUI(isSpeaking ? "SPEAKING" : "OFF");
    }

    function isEchoText(text) {
      if (Date.now() - lastSpokeAt > 500) return false;
      const cand = (text || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
      const prompt = (currentPromptText || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
      return Boolean(cand && prompt && cand.length >= 5 && prompt.includes(cand));
    }

    function startListening() {
      if (!SpeechRec) {
        showBanner("SpeechRecognition is not supported in this browser. Use Google Chrome.");
        return;
      }
      if (isSpeaking || !shouldListen || !isThumbHeld || isListening) return;
      if (state === "IDLE" || state === "DONE" || state === "BIO_SCANNING") return;

      const myTurn = turnId;
      try {
        const rec = new SpeechRec();
        rec.lang = "en-IN";
        rec.continuous = false;
        rec.interimResults = true;
        rec.maxAlternatives = 3;
        activeRec = rec;
        isListening = true;
        updateMicUI("LISTENING");

        let handledResult = false;
        let turnTranscript = "";

        const commitSpeech = (text) => {
          if (handledResult || myTurn !== turnId || !isThumbHeld) return;
          const clean = (text || "").trim();
          if (!clean) return;
          if (isEchoText(clean)) {
            handledResult = true;
            stopListening();
            shouldListen = true;
            restartTimer = setTimeout(() => startListening(), 250);
            return;
          }
          handledResult = true;
          stopListening();
          document.getElementById("heard-transcript").textContent = `Heard: "${clean}"`;
          handleSpokenUtterance(clean);
        };

        rec.onresult = (event) => {
          if (myTurn !== turnId || !isThumbHeld || handledResult) return;
          let interim = "";
          let finalTranscript = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const alt0 = (event.results[i][0]?.transcript || "").trim();
            if (event.results[i].isFinal) finalTranscript += alt0 + " ";
            else interim = alt0;
          }
          turnTranscript = (finalTranscript || interim).trim();
          if (turnTranscript && !isEchoText(turnTranscript)) {
            document.getElementById("heard-transcript").textContent = `Listening: "${turnTranscript}"`;
          }
          if (finalTranscript.trim()) {
            commitSpeech(finalTranscript.trim());
          }
        };

        rec.onspeechend = () => {
          clearTimeout(speechEndTimer);
          speechEndTimer = setTimeout(() => {
            if (!handledResult && turnTranscript && myTurn === turnId && isThumbHeld) {
              commitSpeech(turnTranscript);
            }
          }, 350);
        };

        rec.onnomatch = () => {
          if (handledResult || myTurn !== turnId || !isThumbHeld) return;
          handledResult = true;
          stopListening();
          speak("I didn't catch that. Please say it again clearly.", true);
        };

        rec.onerror = (ev) => {
          isListening = false;
          activeRec = null;
          if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
            shouldListen = false;
            updateMicUI("OFF");
            showBanner("Microphone permission blocked. Allow Microphone in Chrome site settings.");
            return;
          }
          if (!handledResult && shouldListen && isThumbHeld && !isSpeaking && myTurn === turnId) {
            speak(`Speech error (${ev.error}). Please speak again.`, true);
          }
        };

        rec.onend = () => {
          isListening = false;
          activeRec = null;
          if (!handledResult && turnTranscript && myTurn === turnId && isThumbHeld) {
            clearTimeout(speechEndTimer);
            commitSpeech(turnTranscript);
            return;
          }
          if (!handledResult && shouldListen && isThumbHeld && !isSpeaking && myTurn === turnId) {
            speak("I didn't hear anything. Please speak again.", true);
          } else if (!isSpeaking) {
            updateMicUI("OFF");
          }
        };

        rec.start();
      } catch (e) {
        isListening = false;
        activeRec = null;
        if (shouldListen && isThumbHeld && myTurn === turnId) {
          restartTimer = setTimeout(() => startListening(), 400);
        }
      }
    }

    function retryListeningNow() {
      if (!isThumbHeld || state === "IDLE" || state === "DONE") return;
      turnId++;
      stopListening();
      try { window.speechSynthesis.cancel(); } catch (e) {}
      isSpeaking = false;
      shouldListen = true;
      startListening();
    }

    function speak(text, listenAfter) {
      const myTurn = ++turnId;
      currentPromptText = text;
      stopListening();
      clearTimeout(speakWatchdog);
      try { window.speechSynthesis.cancel(); } catch (e) {}

      document.getElementById("kiosk-prompt-text").textContent = text;
      isSpeaking = true;
      updateMicUI("SPEAKING");

      let finished = false;
      const onDone = () => {
        if (finished || myTurn !== turnId) return;
        finished = true;
        clearTimeout(speakWatchdog);
        lastSpokenAt = Date.now();
        isSpeaking = false;
        updateMicUI("OFF");

        if (listenAfter && isThumbHeld && state !== "IDLE" && state !== "DONE" && state !== "BIO_SCANNING") {
          micOpenTimer = setTimeout(() => {
            if (myTurn === turnId && isThumbHeld && !isSpeaking) {
              shouldListen = true;
              startListening();
            }
          }, 450);
        }
      };

      const maxWait = Math.max(1500, Math.min(5500, text.length * 58 + 700));
      speakWatchdog = setTimeout(onDone, maxWait);

      setTimeout(() => {
        if (myTurn !== turnId || finished) return;
        try {
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = "en-IN";
          utter.rate = 1.02;
          window._utter = utter;
          utter.onend = onDone;
          utter.onerror = (ev) => {
            if (ev && (ev.error === "canceled" || ev.error === "interrupted")) return;
            onDone();
          };
          window.speechSynthesis.speak(utter);
        } catch (e) {
          onDone();
        }
      }, 80);
    }

    function repeatCurrentQuestion() {
      if (!currentPromptText) return;
      const shouldListenAfter = isThumbHeld && state !== "IDLE" && state !== "DONE" && state !== "BIO_SCANNING";
      speak(currentPromptText, shouldListenAfter);
    }

    function phoneticNormalize(str) {
      return (str || "")
        .toLowerCase()
        .replace(/ph/g, "f")
        .replace(/sh|ch/g, "s")
        .replace(/th/g, "t")
        .replace(/aa/g, "a")
        .replace(/ee|ii/g, "i")
        .replace(/oo|uu/g, "u")
        .replace(/w/g, "v")
        .replace(/[^a-z\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function bigramSimilarity(a, b) {
      if (!a || !b) return 0;
      if (a === b) return 1;
      if (a.length < 2 || b.length < 2) return a[0] === b[0] ? 0.65 : 0;
      const map = new Map();
      for (let i = 0; i < a.length - 1; i++) {
        const bg = a.slice(i, i + 2);
        map.set(bg, (map.get(bg) || 0) + 1);
      }
      let hits = 0;
      for (let i = 0; i < b.length - 1; i++) {
        const bg = b.slice(i, i + 2);
        const c = map.get(bg) || 0;
        if (c > 0) {
          map.set(bg, c - 1);
          hits++;
        }
      }
      return (2 * hits) / (a.length + b.length - 2);
    }

    function findBestAccountMatch(spokenQuery) {
      const clean = (spokenQuery || "").toLowerCase().replace(/[^a-z\s]/g, " ").replace(/\s+/g, " ").trim();
      const phonQuery = phoneticNormalize(clean);
      if (!clean && !phonQuery) return null;

      let bestAcc = null;
      let bestScore = 0;

      for (const acc of accountsDB) {
        const target = acc.name.toLowerCase().replace(/[^a-z\s]/g, " ").replace(/\s+/g, " ").trim();
        const phonTarget = phoneticNormalize(target);

        if (target === clean || target.includes(clean) || clean.includes(target) || phonTarget === phonQuery) {
          return acc;
        }

        const fullScore = Math.max(bigramSimilarity(clean, target), bigramSimilarity(phonQuery, phonTarget));
        const qFirst = clean.split(" ")[0];
        const tFirst = target.split(" ")[0];
        const pqFirst = phonQuery.split(" ")[0];
        const ptFirst = phonTarget.split(" ")[0];
        const firstScore = Math.max(bigramSimilarity(qFirst, tFirst), bigramSimilarity(pqFirst, ptFirst));
        const score = Math.max(fullScore, firstScore);

        if (score > bestScore) {
          bestScore = score;
          bestAcc = acc;
        }
      }

      return bestScore >= 0.4 ? bestAcc : null;
    }

    function extractNumberFromSpeech(text) {
      if (!text) return null;
      const normalized = text
        .toLowerCase()
        .replace(/₹|rs\.?|rupees?|inr/gi, " ")
        .replace(/,/g, "")
        .replace(/\band\b/g, " ")
        .replace(/\s+/g, " ")
        .trim();

      if (!normalized) return null;

      const scaledMatch = normalized.match(/(\d+(?:\.\d+)?)\s*(k|thousand|tausand|savi|saavira|hajar|lakh|lac|lakhs|hundred)?\b/);
      if (scaledMatch) {
        const base = parseFloat(scaledMatch[1]);
        const unit = scaledMatch[2] || "";
        if (["k", "thousand", "tausand", "savi", "saavira", "hajar"].includes(unit)) return Math.round(base * 1000);
        if (["lakh", "lac", "lakhs"].includes(unit)) return Math.round(base * 100000);
        if (unit === "hundred") return Math.round(base * 100);
        if (!isNaN(base) && base > 0) return base;
      }

      const ones = {
        zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5,
        six: 6, seven: 7, eight: 8, nine: 9, ten: 10,
        eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15,
        sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19
      };
      const tens = {
        twenty: 20, thirty: 30, forty: 40, fifty: 50,
        sixty: 60, seventy: 70, eighty: 80, ninety: 90
      };

      const tokens = normalized.split(/[^a-z0-9]+/).filter(Boolean);
      const hasScale = tokens.some((t) => ["hundred", "thousand", "tausand", "savi", "saavira", "hajar", "lakh", "lac", "lakhs", "k"].includes(t));

      if (!hasScale && tokens.length >= 2 && tokens.every((t) => /^\d$/.test(t) || (t in ones && ones[t] <= 9))) {
        const joined = tokens.map((t) => (/^\d$/.test(t) ? t : String(ones[t]))).join("");
        const parsed = parseInt(joined, 10);
        if (!isNaN(parsed) && parsed > 0) return parsed;
      }

      let total = 0;
      let current = 0;
      let found = false;

      for (const tok of tokens) {
        if (/^\d+$/.test(tok)) {
          current += parseInt(tok, 10);
          found = true;
        } else if (tok in ones) {
          current += ones[tok];
          found = true;
        } else if (tok in tens) {
          current += tens[tok];
          found = true;
        } else if (tok === "hundred") {
          current = (current || 1) * 100;
          found = true;
        } else if (["thousand", "tausand", "savi", "saavira", "hajar", "k"].includes(tok)) {
          total += (current || 1) * 1000;
          current = 0;
          found = true;
        } else if (["lakh", "lac", "lakhs"].includes(tok)) {
          total += (current || 1) * 100000;
          current = 0;
          found = true;
        }
      }

      const result = total + current;
      return found && result > 0 ? result : null;
    }

    function isYes(t) {
      const cleaned = (t || "").toLowerCase().replace(/[^a-z\s]/g, " ").trim();
      return /\b(yes|yeah|yep|yup|confirm|correct|right|okay|sure|proceed|haan|ji)\b/.test(cleaned) || cleaned === "ok";
    }

    function isNo(t) {
      const cleaned = (t || "").toLowerCase().replace(/[^a-z\s]/g, " ").trim();
      return /\b(no|nope|nah|wrong|retry|change|cancel|back|incorrect|nahi)\b/.test(cleaned);
    }

    function handleManualInput(val) {
      if (!val || !val.trim()) return;
      stopListening();
      if (!isThumbHeld && state !== "IDLE") startThumbHold();
      const raw = val.trim();
      document.getElementById("heard-transcript").textContent = `Entered: "${raw}"`;
      handleSpokenUtterance(raw);
    }

    async function handleSpokenUtterance(rawText) {
      if (!isThumbHeld) return;
      const clean = rawText.trim();

      if (state === "ASK_NAME") {
        let match = findBestAccountMatch(clean);
        if (!match) {
          try {
            const res = await fetch(`${BACKEND_API_URL}/api/lookup?name=${encodeURIComponent(clean)}`);
            if (res.ok) {
              const apiAcc = await res.json();
              match = findBestAccountMatch(apiAcc.name) || apiAcc;
            }
          } catch (e) {}
        }

        if (match) {
          txData.matchedUser = match;
          const last4 = match.account.slice(-4);
          document.getElementById("matched-account-display").textContent = `${match.name} — Acct ending ${last4}`;
          document.getElementById("confirm-name-box").style.display = "block";
          setKioskState("VERIFY_NAME");
          speak(`Matched ${match.name}, account ending in ${last4.split("").join(" ")}. Say Yes or No.`, true);
        } else {
          speak(`I heard ${clean}. Please say your registered name again.`, true);
        }
        return;
      }

      if (state === "VERIFY_NAME") {
        if (isYes(clean)) confirmMatchedName(true);
        else if (isNo(clean)) confirmMatchedName(false);
        else speak(`Please say Yes to confirm ${txData.matchedUser.name}, or No to try again.`, true);
        return;
      }

      if (state === "ASK_TX") {
        if (/\bdeposit\b/i.test(clean)) selectTransactionType("DEPOSIT");
        else if (/\bwithdraw/i.test(clean)) selectTransactionType("WITHDRAWAL");
        else speak("Please say Deposit or Withdrawal.", true);
        return;
      }

      if (state === "VERIFY_TX") {
        if (isYes(clean)) confirmTransactionType(true);
        else if (isNo(clean)) confirmTransactionType(false);
        else speak(`Please say Yes to confirm ${txData.txType}, or No to change.`, true);
        return;
      }

      if (state === "ASK_AMOUNT") {
        const parsedAmount = extractNumberFromSpeech(clean);
        if (parsedAmount && parsedAmount > 0) {
          selectAmount(parsedAmount);
        } else {
          speak("Please say the exact amount in rupees again.", true);
        }
        return;
      }

      if (state === "VERIFY_AMOUNT") {
        if (isYes(clean)) runMidSessionBiometricScan();
        else if (isNo(clean)) retryAmount();
        else speak(`Say Yes to confirm ₹${txData.amount.toLocaleString("en-IN")} and print slip, or No to change amount.`, true);
      }
    }

    function confirmMatchedName(ok) {
      document.getElementById("confirm-name-box").style.display = "none";
      if (ok) {
        setKioskState("ASK_TX");
        speak("Confirmed. Say Deposit or Withdrawal.", true);
      } else {
        txData.matchedUser = null;
        setKioskState("ASK_NAME");
        speak("Okay. Say your registered name again.", true);
      }
    }

    function selectTransactionType(type) {
      stopListening();
      txData.txType = type;
      document.getElementById("tx-verify-display").textContent = `Selected: ${type} (Say "Yes" or "No")`;
      document.getElementById("confirm-tx-box").style.display = "block";
      setKioskState("VERIFY_TX");
      speak(`${type} selected. Say Yes or No.`, true);
    }

    function confirmTransactionType(ok) {
      document.getElementById("confirm-tx-box").style.display = "none";
      if (ok) {
        setKioskState("ASK_AMOUNT");
        speak(`How many rupees to ${txData.txType.toLowerCase()}?`, true);
      } else {
        txData.txType = null;
        setKioskState("ASK_TX");
        speak("Say Deposit or Withdrawal.", true);
      }
    }

    function selectAmount(val) {
      const amt = Math.round(parseFloat(val));
      if (isNaN(amt) || amt <= 0) return;
      stopListening();
      txData.amount = amt;
      const formattedAmt = `₹ ${amt.toLocaleString("en-IN")}`;
      const previewVal = document.getElementById("amount-preview-value");
      const previewBox = document.getElementById("amount-preview-box");
      if (previewVal) previewVal.textContent = formattedAmt;
      if (previewBox) previewBox.style.display = "block";
      document.getElementById("final-summary-text").textContent = `${txData.txType} of ${formattedAmt} — ${txData.matchedUser.name}`;
      document.getElementById("final-confirm-box").style.display = "block";
      setKioskState("VERIFY_AMOUNT");
      speak(`Amount is ${amt} rupees for ${txData.txType.toLowerCase()}. Say Yes to authenticate and print slip, or No to change.`, true);
    }

    function retryAmount() {
      document.getElementById("final-confirm-box").style.display = "none";
      const previewBox = document.getElementById("amount-preview-box");
      if (previewBox) previewBox.style.display = "none";
      txData.amount = null;
      setKioskState("ASK_AMOUNT");
      speak("Say the exact amount in rupees again.", true);
    }

    function activateKiosk() {
      document.getElementById("activation-overlay").style.display = "none";
      renderAccountList();
      warmUpBackend();
      speak("Welcome to Voice-Assisted Biometric Banking Slip. Place and hold your thumb on the scanner to begin.", false);
    }

    async function setKioskMode(mode) {
      kioskMode = mode;
      const pBtn = document.getElementById("btn-prototype-mode");
      const uBtn = document.getElementById("btn-user-mode");
      if (mode === "prototype") {
        pBtn.className = "btn btn-accent";
        uBtn.className = "btn";
        hideBanner();
        speak("Prototype Mode active.", false);
      } else {
        uBtn.className = "btn btn-accent";
        pBtn.className = "btn";
        await checkRDServiceHardware();
      }
    }

    async function checkRDServiceHardware() {
      showBanner("Checking UIDAI L1 scanner on https://127.0.0.1:11100...");
      try {
        const controller = new AbortController();
        setTimeout(() => controller.abort(), 2000);
        const res = await fetch("https://127.0.0.1:11100", { method: "RDSERVICE", signal: controller.signal });
        const xml = await res.text();
        if (xml.includes("READY")) {
          hardwareReady = true;
          hideBanner();
        } else {
          throw new Error("NOTREADY");
        }
      } catch (e) {
        hardwareReady = false;
        showBanner("Device Not Connected: UIDAI L1 scanner not found on port 11100. Use Prototype Mode.");
      }
    }

    function startThumbHold(e) {
      if (e) e.preventDefault();
      if (kioskMode === "user" && !hardwareReady) {
        showBanner("L1 Biometric Hardware not connected.");
        return;
      }
      if (isThumbHeld) return;

      isThumbHeld = true;
      biometricPulseCount = 0;
      warmUpBackend();
      updateBiometricUI(true);

      clearInterval(biometricHeartbeatTimer);
      biometricHeartbeatTimer = setInterval(() => {
        if (!isThumbHeld) {
          clearInterval(biometricHeartbeatTimer);
          return;
        }
        biometricPulseCount++;
        document.getElementById("bio-heartbeat-status").textContent = `Pulse #${biometricPulseCount} (Active)`;
        document.getElementById("bio-heartbeat-status").style.color = "#34d399";
      }, 1500);

      if (state === "IDLE") {
        setKioskState("ASK_NAME");
        speak("Thumb locked. Please say your registered full name.", true);
      }
    }

    function releaseThumbHold() {
      if (isSimHold || !isThumbHeld) return;
      isThumbHeld = false;
      clearInterval(biometricHeartbeatTimer);
      updateBiometricUI(false);
      if (state !== "IDLE" && state !== "DONE") {
        abortSession("Thumb contact lost! Transaction aborted for security.");
      }
    }

    function toggleSimulatedHold(checked) {
      isSimHold = checked;
      if (checked) {
        startThumbHold();
      } else {
        isThumbHeld = false;
        clearInterval(biometricHeartbeatTimer);
        updateBiometricUI(false);
        if (state !== "IDLE" && state !== "DONE") {
          abortSession("Thumb contact lost! Transaction aborted for security.");
        }
      }
    }

    function updateBiometricUI(locked) {
      const pad = document.getElementById("thumb-pad");
      const badge = document.getElementById("biometric-badge");
      const label = document.getElementById("thumb-label");
      if (locked) {
        pad.classList.add("locked");
        badge.textContent = "LOCKED & ACTIVE";
        badge.style.color = "#34d399";
        label.textContent = "Thumb Locked";
        document.getElementById("bio-heartbeat-status").textContent = "Pulse #1 (Active)";
        document.getElementById("bio-heartbeat-status").style.color = "#34d399";
      } else {
        pad.classList.remove("locked");
        badge.textContent = "WAITING";
        badge.style.color = "#94a3b8";
        label.textContent = "Press & Hold Thumb";
        document.getElementById("bio-heartbeat-status").textContent = "Idle";
        document.getElementById("bio-heartbeat-status").style.color = "#64748b";
      }
    }

    function abortSession(reason) {
      turnId++;
      stopListening();
      clearTimeout(speakWatchdog);
      clearInterval(biometricHeartbeatTimer);
      txData = { matchedUser: null, txType: null, amount: null };
      document.getElementById("sim-hold-toggle").checked = false;
      isSimHold = false;
      isThumbHeld = false;
      updateBiometricUI(false);
      document.getElementById("bio-auth-status").textContent = "Aborted";
      document.getElementById("bio-auth-status").style.color = "#f87171";
      showBanner(reason);
      setKioskState("IDLE");
      speak(`${reason} Hold your thumb to start again.`, false);
    }

    async function runMidSessionBiometricScan() {
      if (!isThumbHeld) {
        abortSession("Thumb removed during biometric authentication!");
        return;
      }
      stopListening();
      setKioskState("BIO_SCANNING");
      document.getElementById("bio-auth-status").textContent = "Scanning...";
      document.getElementById("bio-auth-status").style.color = "#fbbf24";
      speak("Authenticating thumbprint and preparing your slip.", false);

      setTimeout(async () => {
        if (!isThumbHeld) {
          abortSession("Thumb lifted during biometric verification!");
          return;
        }
        document.getElementById("bio-auth-status").textContent = "AUTHENTICATED ✔";
        document.getElementById("bio-auth-status").style.color = "#34d399";
        await generateFinalSlip();
      }, 1200);
    }

    function triggerSlipPrint() {
      try {
        window.print();
      } catch (e) {}
    }

    async function generateFinalSlip() {
      setKioskState("DONE");
      document.getElementById("step-workspace").style.display = "none";

      let refId = "BIO-" + Math.random().toString(36).substring(2, 10).toUpperCase();
      let timestamp = new Date().toLocaleString("en-IN");
      let hash = "";

      try {
        const res = await fetch(`${BACKEND_API_URL}/api/generate-slip`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: txData.matchedUser.name,
            account: txData.matchedUser.account,
            tx_type: txData.txType,
            amount: txData.amount,
            biometric_pulses: biometricPulseCount || 1
          })
        });
        if (res.ok) {
          const data = await res.json();
          refId = data.reference_id;
          timestamp = data.timestamp;
          hash = data.esign_hash;
        }
      } catch (e) {}

      if (!hash) {
        hash = await sha256Hex(`${txData.matchedUser.account}:${txData.txType}:${txData.amount}:${Date.now()}`);
      }

      document.getElementById("slip-tx-type").textContent = `${txData.txType} SLIP`;
      document.getElementById("slip-timestamp").textContent = timestamp;
      document.getElementById("slip-name").textContent = txData.matchedUser.name;
      document.getElementById("slip-account").textContent = txData.matchedUser.account;
      document.getElementById("slip-amount").textContent = `₹ ${txData.amount.toLocaleString("en-IN")}.00`;
      document.getElementById("slip-ref").textContent = refId;
      document.getElementById("slip-hash").textContent = `eSign Hash: ${hash}`;
      document.getElementById("printable-slip").style.display = "block";
      document.getElementById("heard-transcript").textContent = `Slip generated for ₹${txData.amount.toLocaleString("en-IN")} (${refId}).`;
      speak("Authentication complete. Your slip is ready and opening for print. You may release your thumb now.", false);

      setTimeout(() => {
        if (state === "DONE") triggerSlipPrint();
      }, 600);
    }

    function resetAfterCompletion() {
      turnId++;
      stopListening();
      clearTimeout(speakWatchdog);
      clearInterval(biometricHeartbeatTimer);
      txData = { matchedUser: null, txType: null, amount: null };
      const previewBox = document.getElementById("amount-preview-box");
      if (previewBox) previewBox.style.display = "none";
      document.getElementById("sim-hold-toggle").checked = false;
      isSimHold = false;
      isThumbHeld = false;
      updateBiometricUI(false);
      document.getElementById("bio-auth-status").textContent = "Pending";
      document.getElementById("bio-auth-status").style.color = "#64748b";
      document.getElementById("printable-slip").style.display = "none";
      document.getElementById("step-workspace").style.display = "block";
      setKioskState("IDLE");
      speak("Ready for next user. Place and hold your thumb to begin.", false);
    }

    function setKioskState(newState) {
      state = newState;
      const stepMap = {
        IDLE: 1, ASK_NAME: 2, VERIFY_NAME: 2, ASK_TX: 3, VERIFY_TX: 3,
        ASK_AMOUNT: 4, VERIFY_AMOUNT: 4, BIO_SCANNING: 4, DONE: 4
      };
      const activeNum = stepMap[newState] || 1;
      [1, 2, 3, 4].forEach((n) => {
        const el = document.getElementById(`prog-${n}`);
        el.className = n <= activeNum ? "step-pill active" : "step-pill";
      });

      const labels = {
        IDLE: "Step 1 / 4 — Waiting for Thumb",
        ASK_NAME: "Step 2 / 4 — Customer Name",
        VERIFY_NAME: "Step 2 / 4 — Verify Account",
        ASK_TX: "Step 3 / 4 — Transaction Type",
        VERIFY_TX: "Step 3 / 4 — Verify Type",
        ASK_AMOUNT: "Step 4 / 4 — Amount",
        VERIFY_AMOUNT: "Step 4 / 4 — Final Verification",
        BIO_SCANNING: "Biometric Scan in Progress...",
        DONE: "Completed — Slip Generated"
      };
      document.getElementById("step-counter").textContent = labels[newState] || newState;

      document.getElementById("ui-step-1").style.display = newState === "IDLE" ? "block" : "none";
      document.getElementById("ui-step-2").style.display = (newState === "ASK_NAME" || newState === "VERIFY_NAME") ? "block" : "none";
      document.getElementById("ui-step-3").style.display = (newState === "ASK_TX" || newState === "VERIFY_TX") ? "block" : "none";
      document.getElementById("ui-step-4").style.display = (newState === "ASK_AMOUNT" || newState === "VERIFY_AMOUNT" || newState === "BIO_SCANNING") ? "block" : "none";

      if (newState === "ASK_NAME") document.getElementById("confirm-name-box").style.display = "none";
      if (newState === "ASK_TX") document.getElementById("confirm-tx-box").style.display = "none";
      if (newState === "ASK_AMOUNT") {
        const previewBox = document.getElementById("amount-preview-box");
        if (previewBox) previewBox.style.display = "none";
        document.getElementById("final-confirm-box").style.display = "none";
      }
      hideBanner();
    }

    function toggleAccountModal(show) {
      document.getElementById("account-modal").style.display = show ? "flex" : "none";
      if (show) renderAccountList();
    }

    function generateRandomAccountNum() {
      document.getElementById("new-acc-num").value = Math.floor(1000000000 + Math.random() * 9000000000).toString();
    }

    async function addNewAccount() {
      const name = document.getElementById("new-acc-name").value.trim();
      const account = document.getElementById("new-acc-num").value.trim();
      if (!name || account.length < 6) return;
      accountsDB.push({ name, account });
      localStorage.setItem("kiosk_accounts_db", JSON.stringify(accountsDB));
      try {
        await fetch(`${BACKEND_API_URL}/api/accounts`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, account })
        });
      } catch (e) {}
      document.getElementById("new-acc-name").value = "";
      document.getElementById("new-acc-num").value = "";
      renderAccountList();
    }

    function renderAccountList() {
      document.getElementById("account-count").textContent = accountsDB.length;
      document.getElementById("registered-accounts-list").innerHTML = accountsDB.map((a) => `
        <li style="display:flex;justify-content:space-between;background:#060a14;padding:8px 10px;border-radius:8px;border:1px solid #1e293b;">
          <span>${a.name}</span>
          <span class="mono" style="color:#34d399;">${a.account}</span>
        </li>
      `).join("");
    }

    function showBanner(msg) {
      const el = document.getElementById("alert-banner");
      el.textContent = msg;
      el.style.display = "block";
    }

    function hideBanner() {
      document.getElementById("alert-banner").style.display = "none";
    }

    async function sha256Hex(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map((b) => b.toString(16).padStart(2, "0")).join("").toUpperCase();
    }
  </script>
